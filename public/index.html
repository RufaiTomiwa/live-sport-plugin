<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nuvio Live Sports</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg style='mix-blend-mode:screen'%3E%3Crect x='2' y='8' width='24' height='24' rx='6' fill='%23FF4FA3'/%3E%3Crect x='14' y='8' width='24' height='24' rx='6' fill='%235B86FF'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/sleeve.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body{padding-bottom:env(safe-area-inset-bottom)}
    .appbar{padding:var(--sp-3) var(--sp-4)}
    .appbar .brand{font-size:clamp(var(--size-md),4vw,var(--size-lg))}
    .appbar .btn{padding:0 var(--sp-4);min-height:40px;font-size:var(--size-xs)}

    main{max-width:1600px;margin:0 auto;padding:var(--sp-4) var(--sp-4) var(--sp-8)}

    /* Filter row: chips get their own full-width scroller, search sits below.
       Stacking these (instead of squeezing chips beside a fixed-width search
       box) is what keeps chips tappable on narrow screens. */
    .filterbar{display:flex;flex-direction:column;gap:var(--sp-3);margin-bottom:var(--sp-5)}
    .chipscroller{position:relative;margin:0 calc(var(--sp-4) * -1)}
    .chipscroller::before,.chipscroller::after{
      content:"";position:absolute;top:0;bottom:0;width:28px;z-index:2;pointer-events:none}
    .chipscroller::before{left:0;background:linear-gradient(to right,var(--stock-base),transparent)}
    .chipscroller::after{right:0;background:linear-gradient(to left,var(--stock-base),transparent)}
    .chiprow{display:flex;gap:var(--sp-2);overflow-x:auto;padding:2px var(--sp-4);
      scroll-snap-type:x proximity;scrollbar-width:none}
    .chiprow::-webkit-scrollbar{display:none}
    .chiprow .chip{scroll-snap-align:start;flex:none}
    .search .input{background:var(--stock-raised)}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--sp-4)}

    .match{overflow:hidden}
    .match .art{aspect-ratio:16/9;width:100%}
    .match .art img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      filter:blur(18px) brightness(.5);transform:scale(1.2);transition:filter var(--motion-base),transform var(--motion-base)}
    .match:hover .art img.bg{filter:blur(12px) brightness(.65);transform:scale(1.1)}
    .match .art img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
      padding:var(--sp-3);z-index:1;transition:transform var(--motion-base)}
    .match:hover .art img.poster{transform:scale(1.04)}
    .match .art img.logo{position:absolute;top:var(--sp-3);left:var(--sp-3);width:36px;height:36px;z-index:3;
      border-radius:var(--r-sm);background:rgba(18,16,38,.75);object-fit:contain;padding:5px;
      border:1px solid var(--stock-line-strong)}
    .match .art .badge.badge--pink{position:absolute;top:var(--sp-3);right:var(--sp-3);z-index:3}
    .match .art .cat-badge{position:absolute;top:var(--sp-3);left:var(--sp-3);z-index:3}
    .match .art img.logo ~ .cat-badge{left:calc(36px + var(--sp-3) + var(--sp-2))}

    .match .info{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:var(--sp-7) var(--sp-4) var(--sp-4)}
    .match .name{font-family:var(--font-display);font-weight:700;font-size:var(--size-lg);
      line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
      overflow:hidden;text-shadow:0 2px 8px rgba(0,0,0,.8)}
    .match .league{font-family:var(--font-data);font-size:11px;letter-spacing:.06em;
      color:var(--text-secondary);margin-top:var(--sp-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .match .play-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:rgba(9,8,20,0);opacity:0;transition:all var(--motion-base);z-index:2;pointer-events:none}
    .match:hover .play-hint{opacity:1;background:rgba(9,8,20,.25)}
    .match .play-hint .circle{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);
      backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;
      transform:scale(.8);transition:transform var(--motion-base)}
    .match:hover .play-hint .circle{transform:scale(1)}

    @media (max-width:640px){
      main{padding:var(--sp-3) var(--sp-3) var(--sp-7)}
      .grid{gap:var(--sp-3)}
      .chipscroller{margin:0 calc(var(--sp-3) * -1)}
      .chiprow{padding:2px var(--sp-3)}
    }

    /* ─── Player ─── */
    #player-overlay{display:none;position:fixed;inset:0;background:var(--stock-base);
      z-index:100;flex-direction:column}
    #close-btn{position:absolute;top:calc(var(--sp-4) + env(safe-area-inset-top));right:var(--sp-4);z-index:101}
    #video-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
    video{width:100%;height:100%;max-width:1600px;background:#000}
    @media (min-width:900px){video{max-height:88vh;border-radius:var(--r-lg)}}
    .loader{position:absolute;display:flex;flex-direction:column;align-items:center;gap:var(--sp-4)}
    .spinner{width:40px;height:40px;border:3px solid var(--stock-line-strong);border-top-color:var(--ink-pink);
      border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .unmute-hint{position:absolute;bottom:calc(var(--sp-6) + env(safe-area-inset-bottom));left:50%;
      transform:translateX(-50%);z-index:5;display:none;align-items:center;gap:var(--sp-2)}
  </style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 7v6m0 4v.5"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15l13-7.5z"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9v6h4l5 5V4L8 9z"/></symbol>
</svg>

<header class="appbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true">
      <g style="mix-blend-mode:screen">
        <rect x="2" y="8" width="24" height="24" rx="6" fill="#FF4FA3"/>
        <rect x="14" y="8" width="24" height="24" rx="6" fill="#5B86FF"/>
      </g>
    </svg>
    NUVIO SPORTS
  </div>
  <a href="/configure" class="btn btn--curate">Configure</a>
</header>

<main>
  <div class="filterbar">
    <div class="chipscroller">
      <div class="chiprow" id="tabs" role="tablist" aria-label="Sport categories">
        <span class="t-secondary" style="padding:var(--sp-2) 0">Loading categories&hellip;</span>
      </div>
    </div>
    <div class="field search">
      <svg width="20" height="20"><use href="#i-search"/></svg>
      <label class="label" for="searchInput" style="position:absolute;left:-9999px">Search matches</label>
      <input type="text" id="searchInput" class="input" placeholder="Search matches, teams&hellip;">
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div id="toastHost" aria-live="polite"></div>

<div id="player-overlay">
  <button id="close-btn" class="btn btn--icon btn--secondary" aria-label="Close player" onclick="closePlayer()">
    <svg width="20" height="20"><use href="#i-x"/></svg>
  </button>
  <div id="video-container">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span class="t-data">Loading stream&hellip;</span>
    </div>
    <video id="video" controls autoplay playsinline webkit-playsinline muted></video>
    <button class="btn btn--sm unmute-hint" id="unmuteHint" onclick="unmuteVideo()">
      <svg width="16" height="16"><use href="#i-volume"/></svg> Tap to unmute
    </button>
  </div>
</div>

<div id="sheet-backdrop" class="sheet-backdrop" style="display:none" onclick="if(event.target===this) closeSourceSheet()">
  <div class="sheet">
    <div class="grabber"></div>
    <h3 class="t-title" style="font-size:var(--size-xl);margin:0 0 var(--sp-4)">Select stream source</h3>
    <div id="source-buttons" style="display:flex;flex-direction:column;gap:var(--sp-2)"></div>
  </div>
</div>

<script>
  let hls = null;
  let currentMatches = [];

  function toast(message, variant) {
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = 'toast' + (variant === 'danger' ? ' toast--danger' : ' toast--pink');
    el.setAttribute('role', variant === 'danger' ? 'alert' : 'status');
    const icon = variant === 'danger' ? 'i-alert' : 'i-check';
    const color = variant === 'danger' ? 'var(--sem-danger)' : 'var(--ink-pink)';
    el.innerHTML = `<svg width="18" height="18" style="color:${color};flex:none"><use href="#${icon}"/></svg><span>${message}</span>`;
    host.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 200ms'; setTimeout(() => el.remove(), 220); }, 3800);
  }

  function skeletonGrid(count) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'card match';
      el.innerHTML = `
        <div class="art skeleton" style="aspect-ratio:16/9"></div>
        <div style="padding:var(--sp-3)">
          <div class="skeleton" style="height:14px;width:70%;margin-bottom:8px"></div>
          <div class="skeleton" style="height:11px;width:45%"></div>
        </div>`;
      grid.appendChild(el);
    }
  }

  async function loadTabs() {
    try {
      const res = await fetch('/manifest.json');
      const manifest = await res.json();
      const tabsContainer = document.getElementById('tabs');
      tabsContainer.innerHTML = '';

      let firstCatalog = null;
      let firstChip = null;

      manifest.catalogs.forEach((catalog) => {
        if (catalog.type !== 'tv' || catalog.id === 'nuvio_sports_teams') return;
        if (!firstCatalog) firstCatalog = catalog.id;

        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.setAttribute('role', 'tab');
        chip.setAttribute('aria-pressed', 'false');
        chip.innerText = catalog.name.replace('nuvio ', '').replace('Nuvio ', '');
        chip.onclick = () => loadCatalog(catalog.id, chip);
        tabsContainer.appendChild(chip);

        if (!firstChip) firstChip = chip;
      });

      if (firstCatalog && firstChip) loadCatalog(firstCatalog, firstChip);
    } catch (err) {
      console.error('Failed to load manifest', err);
      document.getElementById('tabs').innerHTML = '<span style="color:var(--sem-danger)">Failed to load categories.</span>';
      toast('Could not reach the addon server.', 'danger');
    }
  }

  async function loadCatalog(catalogId, chipEl) {
    if (chipEl) {
      document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
      chipEl.setAttribute('aria-pressed', 'true');
      chipEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    document.getElementById('searchInput').value = '';
    skeletonGrid(8);

    try {
      const res = await fetch(`/catalog/tv/${catalogId}.json`);
      const data = await res.json();
      currentMatches = data.metas || [];
      renderGrid(currentMatches);
    } catch (err) {
      console.error(err);
      document.getElementById('grid').innerHTML = '';
      toast('Failed to load this catalog.', 'danger');
    }
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    const filtered = currentMatches.filter(meta =>
      meta.name.toLowerCase().includes(query) ||
      (meta.description && meta.description.toLowerCase().includes(query))
    );
    renderGrid(filtered);
  });

  // Descriptions come as newline-separated "Label: value" pairs (League,
  // Category, Status). Status is dropped since the LIVE badge already
  // covers it; League/Category become a compact subtitle + badge instead
  // of a wall of raw text.
  function parseMeta(desc) {
    const out = {};
    (desc || '').split('\n').forEach(line => {
      const m = line.match(/(League|Category)\s*:\s*(.+)/i);
      if (m) out[m[1].toLowerCase()] = m[2].trim();
    });
    return out;
  }

  function renderGrid(metas) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    if (!metas || metas.length === 0) {
      grid.innerHTML = `
        <div class="empty">
          <div class="title">No matches here right now.</div>
          <div class="sub">Try another category, or check back closer to kickoff.</div>
        </div>`;
      return;
    }

    metas.forEach(meta => {
      const card = document.createElement('div');
      card.className = 'card card--interactive match';
      card.onclick = () => fetchAndPlay(meta.id);

      const isLive = meta.name.includes('🔴');
      const cleanName = meta.name.replace('🔴 [LIVE] ', '');
      const { league, category } = parseMeta(meta.description);

      card.innerHTML = `
        <div class="art art--scrim">
          <img class="bg" src="${meta.background}" onerror="this.style.display='none'" loading="lazy">
          <img class="poster" src="${meta.poster}" onerror="this.src='https://raw.githubusercontent.com/stremio/stremio-addon-sdk/master/docs/api/images/stremio-logo.png'" loading="lazy">
          ${meta.logo && meta.logo !== meta.poster ? `<img class="logo" src="${meta.logo}">` : ''}
          ${category ? `<span class="badge badge--outline cat-badge">${category}</span>` : ''}
          ${isLive ? '<span class="badge badge--pink">Live</span>' : ''}
          <div class="play-hint"><span class="circle"><svg width="22" height="22"><use href="#i-play"/></svg></span></div>
          <div class="info">
            <div class="name">${cleanName}</div>
            ${league ? `<div class="league">${league}</div>` : ''}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  async function fetchAndPlay(id) {
    document.getElementById('player-overlay').style.display = 'flex';
    document.getElementById('loader').style.display = 'flex';
    closeSourceSheet();
    const video = document.getElementById('video');
    video.style.opacity = '0';

    // Prime the media element synchronously within the click's gesture
    // context. Mobile browsers gate autoplay to calls made during (or very
    // soon after) a user gesture; the fetch below is async, so by the time
    // the real stream is ready that window can have closed. Starting a
    // muted play() now keeps the element "unlocked" for the real play()
    // call later, which is why streams intermittently failed to start.
    try { video.muted = true; video.play().catch(() => {}); } catch (_) {}

    try {
      const res = await fetch(`/stream/tv/${id}.json`);
      const data = await res.json();

      if (!data.streams || data.streams.length === 0) {
        toast('No streams found for this match.', 'danger');
        closePlayer();
        return;
      }

      if (data.streams.length === 1) {
        playStreamUrl(data.streams[0].url, data.streams[0]);
      } else {
        document.getElementById('loader').style.display = 'none';
        const btnContainer = document.getElementById('source-buttons');
        btnContainer.innerHTML = '';

        data.streams.forEach(stream => {
          const btn = document.createElement('button');
          btn.className = 'btn btn--secondary btn--block';
          btn.style.justifyContent = 'space-between';
          btn.innerHTML = `${stream.title} <svg width="18" height="18"><use href="#i-chevron"/></svg>`;
          btn.onclick = () => {
            closeSourceSheet();
            document.getElementById('loader').style.display = 'flex';
            playStreamUrl(stream.url, stream);
          };
          btnContainer.appendChild(btn);
        });

        document.getElementById('sheet-backdrop').style.display = 'flex';
      }
    } catch (err) {
      console.error(err);
      toast('Error resolving stream.', 'danger');
      closePlayer();
    }
  }

  function closeSourceSheet() {
    document.getElementById('sheet-backdrop').style.display = 'none';
  }

  function unmuteVideo() {
    const video = document.getElementById('video');
    video.muted = false;
    document.getElementById('unmuteHint').style.display = 'none';
  }

  function playStreamUrl(url, streamObj = null) {
    if (streamObj && streamObj.externalUrl) {
      window.open(streamObj.externalUrl, '_blank');
      closePlayer();
      return;
    }

    const video = document.getElementById('video');
    document.getElementById('loader').style.display = 'none';
    video.style.opacity = '1';

    if (!url) {
      toast('This stream cannot be played in the browser directly.', 'danger');
      closePlayer();
      return;
    }

    const tryUnmuteAfterStart = () => {
      // Muted autoplay is reliable everywhere; toggling mute off after
      // playback has already begun is not gated the way starting playback
      // is, so this quietly restores sound without needing a fresh tap.
      video.muted = false;
      if (video.muted) document.getElementById('unmuteHint').style.display = 'inline-flex';
    };

    if (Hls.isSupported()) {
      if (hls) hls.destroy();
      hls = new Hls({ maxBufferLength: 30 });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().then(tryUnmuteAfterStart).catch(() => {
          document.getElementById('unmuteHint').style.display = 'inline-flex';
        });
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play().then(tryUnmuteAfterStart).catch(() => {
        document.getElementById('unmuteHint').style.display = 'inline-flex';
      });
    }
  }

  function closePlayer() {
    document.getElementById('player-overlay').style.display = 'none';
    document.getElementById('unmuteHint').style.display = 'none';
    closeSourceSheet();
    const video = document.getElementById('video');
    video.pause();
    video.src = '';
    video.muted = true;
    if (hls) { hls.destroy(); hls = null; }
  }

  skeletonGrid(8);
  loadTabs();
</script>
</body>
</html>
