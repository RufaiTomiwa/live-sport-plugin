<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nuvio Live Sports</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg style='mix-blend-mode:screen'%3E%3Crect x='2' y='8' width='24' height='24' rx='6' fill='%23FF4FA3'/%3E%3Crect x='14' y='8' width='24' height='24' rx='6' fill='%235B86FF'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/sleeve.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body{
      padding-bottom:env(safe-area-inset-bottom);
      background-image:radial-gradient(circle at 50% 0%,rgba(255,79,163,.06),transparent 40%);
    }
    .appbar{padding:var(--sp-3) var(--sp-4)}
    .appbar .brand{font-size:clamp(var(--size-md),4vw,var(--size-lg));gap:var(--sp-2)}
    .appbar .actions{display:flex;align-items:center;gap:var(--sp-2)}
    .appbar .btn--curate{padding:0 var(--sp-4);min-height:40px;font-size:var(--size-xs)}

    main{max-width:1800px;margin:0 auto}

    /* ─── Quick nav: jumps the page to a rail, doesn't gate content ─── */
    .quicknav-wrap{position:relative;padding:var(--sp-3) 0}
    .quicknav-wrap::before,.quicknav-wrap::after{
      content:"";position:absolute;top:0;bottom:0;width:32px;z-index:2;pointer-events:none}
    .quicknav-wrap::before{left:0;background:linear-gradient(to right,var(--stock-base),transparent)}
    .quicknav-wrap::after{right:0;background:linear-gradient(to left,var(--stock-base),transparent)}
    .quicknav{display:flex;gap:var(--sp-2);overflow-x:auto;padding:2px var(--sp-4);
      scroll-snap-type:x proximity;scrollbar-width:none}
    .quicknav::-webkit-scrollbar{display:none}
    .quicknav .chip{scroll-snap-align:start;flex:none}

    /* ─── Hero ─── */
    .hero{position:relative;margin:0 var(--sp-4) var(--sp-6);border-radius:var(--r-xl);overflow:hidden;
      aspect-ratio:16/8;background:var(--stock-raised)}
    .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .hero .scrim{position:absolute;inset:0;
      background:linear-gradient(to top,rgba(9,8,20,.95) 10%,rgba(9,8,20,.4) 55%,rgba(9,8,20,.1) 100%),
                 linear-gradient(to right,rgba(9,8,20,.55) 0%,transparent 55%)}
    .hero .content{position:absolute;left:0;right:0;bottom:0;padding:var(--sp-6) var(--sp-5);
      display:flex;flex-direction:column;gap:var(--sp-3);max-width:720px}
    .hero .eyebrow{display:flex;align-items:center;gap:var(--sp-2)}
    .hero h1{font-size:clamp(1.5rem,4.5vw,2.75rem);text-shadow:0 4px 20px rgba(0,0,0,.6)}
    .hero .meta{color:var(--text-secondary);font-size:var(--size-sm)}
    .hero .cta-row{display:flex;gap:var(--sp-3);margin-top:var(--sp-2)}
    .hero-skeleton{aspect-ratio:16/8;margin:0 var(--sp-4) var(--sp-6);border-radius:var(--r-xl)}
    @media (max-width:640px){
      .hero{aspect-ratio:3/4;margin:0 var(--sp-3) var(--sp-5);border-radius:var(--r-lg)}
      .hero-skeleton{aspect-ratio:3/4;margin:0 var(--sp-3) var(--sp-5);border-radius:var(--r-lg)}
      .hero .content{padding:var(--sp-4)}
    }

    /* ─── Rails ─── */
    .rail{margin-bottom:var(--sp-6)}
    .rail-head{display:flex;align-items:center;justify-content:space-between;
      padding:0 var(--sp-4);margin-bottom:var(--sp-3)}
    .rail-head h2{font-size:var(--size-lg);display:flex;align-items:center;gap:var(--sp-2)}
    .rail-nav{display:none;gap:var(--sp-2)}
    @media (hover:hover) and (pointer:fine){.rail-nav{display:flex}}
    .rail-scroll-outer{position:relative}
    .rail-scroll-outer::before,.rail-scroll-outer::after{
      content:"";position:absolute;top:0;bottom:0;width:40px;z-index:2;pointer-events:none}
    .rail-scroll-outer::before{left:0;background:linear-gradient(to right,var(--stock-base),transparent)}
    .rail-scroll-outer::after{right:0;background:linear-gradient(to left,var(--stock-base),transparent)}
    .rail-scroller{display:flex;gap:var(--sp-3);overflow-x:auto;padding:0 var(--sp-4) var(--sp-2);
      scroll-snap-type:x proximity;scroll-behavior:smooth;scrollbar-width:none}
    .rail-scroller::-webkit-scrollbar{display:none}

    .rcard{flex:none;width:250px;cursor:pointer;scroll-snap-align:start}
    .rcard .art{aspect-ratio:16/9;width:100%;border-radius:var(--r-md);background:var(--stock-raised-2)}
    .rcard .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      transition:transform var(--motion-base)}
    .rcard:hover .art img{transform:scale(1.06)}
    .rcard .art .badge--pink{position:absolute;top:var(--sp-2);right:var(--sp-2)}
    .rcard .art .logo{position:absolute;bottom:var(--sp-2);left:var(--sp-2);width:28px;height:28px;
      border-radius:var(--r-sm);background:rgba(18,16,38,.75);object-fit:contain;padding:4px;z-index:2}
    .rcard .body{padding:var(--sp-2) 2px 0}
    .rcard .title{font-family:var(--font-display);font-weight:700;font-size:var(--size-sm);
      line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rcard .sub{font-family:var(--font-data);font-size:11px;letter-spacing:.04em;
      color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    @media (max-width:640px){.rcard{width:198px}}

    /* ─── Search overlay ─── */
    #searchOverlay{position:fixed;inset:0;background:var(--stock-base);z-index:90;display:none;
      flex-direction:column;padding:var(--sp-4)}
    #searchOverlay .bar{display:flex;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-5)}
    #searchOverlay .field{flex:1}
    #searchResults{flex:1;overflow-y:auto;display:grid;
      grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--sp-3);align-content:start}

    #toastHost{padding-bottom:env(safe-area-inset-bottom)}

    /* ─── Player ─── */
    #player-overlay{display:none;position:fixed;inset:0;background:var(--stock-base);
      z-index:100;flex-direction:column}
    #close-btn{position:absolute;top:calc(var(--sp-4) + env(safe-area-inset-top));right:var(--sp-4);z-index:101}
    #video-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
    video{width:100%;height:100%;max-width:1600px;background:#000}
    @media (min-width:900px){video{max-height:88vh;border-radius:var(--r-lg)}}
    .loader{position:absolute;display:flex;flex-direction:column;align-items:center;gap:var(--sp-4)}
    .spinner{width:40px;height:40px;border:3px solid var(--stock-line-strong);border-top-color:var(--ink-pink);
      border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .unmute-hint{position:absolute;bottom:calc(var(--sp-6) + env(safe-area-inset-bottom));left:50%;
      transform:translateX(-50%);z-index:5;display:none;align-items:center;gap:var(--sp-2)}
  </style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 7v6m0 4v.5"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15l13-7.5z"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9v6h4l5 5V4L8 9z"/></symbol>
</svg>

<header class="appbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true">
      <g style="mix-blend-mode:screen">
        <rect x="2" y="8" width="24" height="24" rx="6" fill="#FF4FA3"/>
        <rect x="14" y="8" width="24" height="24" rx="6" fill="#5B86FF"/>
      </g>
    </svg>
    NUVIO SPORTS
  </div>
  <div class="actions">
    <button class="btn btn--icon btn--secondary" aria-label="Search" onclick="openSearch()">
      <svg width="20" height="20"><use href="#i-search"/></svg>
    </button>
    <a href="/configure" class="btn btn--curate">Configure</a>
  </div>
</header>

<main>
  <div class="quicknav-wrap">
    <div class="quicknav" id="quicknav" role="tablist" aria-label="Jump to sport">
      <span class="t-secondary" style="padding:var(--sp-2) 0">Loading&hellip;</span>
    </div>
  </div>

  <div id="heroSlot"><div class="hero-skeleton skeleton"></div></div>

  <div id="rails"></div>
</main>

<div id="toastHost" aria-live="polite"></div>

<div id="searchOverlay">
  <div class="bar">
    <div class="field search" style="margin:0">
      <svg width="20" height="20"><use href="#i-search"/></svg>
      <input type="text" id="searchInput" class="input" placeholder="Search matches, teams&hellip;" autocomplete="off">
    </div>
    <button class="btn btn--icon btn--secondary" aria-label="Close search" onclick="closeSearch()">
      <svg width="20" height="20"><use href="#i-x"/></svg>
    </button>
  </div>
  <div id="searchResults"></div>
</div>

<div id="player-overlay">
  <button id="close-btn" class="btn btn--icon btn--secondary" aria-label="Close player" onclick="closePlayer()">
    <svg width="20" height="20"><use href="#i-x"/></svg>
  </button>
  <div id="video-container">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span class="t-data">Loading stream&hellip;</span>
    </div>
    <video id="video" controls autoplay playsinline webkit-playsinline muted></video>
    <button class="btn btn--sm unmute-hint" id="unmuteHint" onclick="unmuteVideo()">
      <svg width="16" height="16"><use href="#i-volume"/></svg> Tap to unmute
    </button>
  </div>
</div>

<div id="sheet-backdrop" class="sheet-backdrop" style="display:none" onclick="if(event.target===this) closeSourceSheet()">
  <div class="sheet">
    <div class="grabber"></div>
    <h3 class="t-title" style="font-size:var(--size-xl);margin:0 0 var(--sp-4)">Select stream source</h3>
    <div id="source-buttons" style="display:flex;flex-direction:column;gap:var(--sp-2)"></div>
  </div>
</div>

<script>
  let hls = null;
  const allMatches = new Map(); // id -> meta, aggregated across every loaded catalog, backs search

  function toast(message, variant) {
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = 'toast' + (variant === 'danger' ? ' toast--danger' : ' toast--pink');
    el.setAttribute('role', variant === 'danger' ? 'alert' : 'status');
    const icon = variant === 'danger' ? 'i-alert' : 'i-check';
    const color = variant === 'danger' ? 'var(--sem-danger)' : 'var(--ink-pink)';
    el.innerHTML = `<svg width="18" height="18" style="color:${color};flex:none"><use href="#${icon}"/></svg><span>${message}</span>`;
    host.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 200ms'; setTimeout(() => el.remove(), 220); }, 3800);
  }

  // Descriptions arrive as newline-separated "Label: value" lines (League,
  // Category, Status). Status is dropped since the LIVE badge covers it.
  function parseMeta(desc) {
    const out = {};
    (desc || '').split('\n').forEach(line => {
      const m = line.match(/(League|Category)\s*:\s*(.+)/i);
      if (m) out[m[1].toLowerCase()] = m[2].trim();
    });
    return out;
  }

  function isLiveMeta(meta) { return meta.name.includes('🔴'); }
  function cleanTitle(meta) { return meta.name.replace('🔴 [LIVE] ', ''); }

  function rcardHTML(meta) {
    const isLive = isLiveMeta(meta);
    const { league, category } = parseMeta(meta.description);
    return `
      <div class="rcard" onclick="fetchAndPlay('${meta.id.replace(/'/g, "\\'")}')">
        <div class="art">
          <img src="${meta.poster || meta.background}" loading="lazy"
               onerror="this.src='${meta.background || ''}'; this.onerror=null;">
          ${meta.logo ? `<img class="logo" src="${meta.logo}">` : ''}
          ${isLive ? '<span class="badge badge--pink">Live</span>' : ''}
        </div>
        <div class="body">
          <div class="title">${cleanTitle(meta)}</div>
          <div class="sub">${league || category || ''}</div>
        </div>
      </div>`;
  }

  function railSkeleton(count) {
    return Array.from({ length: count }).map(() => `
      <div class="rcard">
        <div class="art skeleton"></div>
        <div class="body">
          <div class="skeleton" style="height:12px;width:85%;margin-bottom:6px"></div>
          <div class="skeleton" style="height:10px;width:50%"></div>
        </div>
      </div>`).join('');
  }

  function renderHero(meta) {
    const slot = document.getElementById('heroSlot');
    if (!meta) { slot.innerHTML = ''; return; }
    const isLive = isLiveMeta(meta);
    const { league, category } = parseMeta(meta.description);
    slot.innerHTML = `
      <div class="hero" onclick="fetchAndPlay('${meta.id.replace(/'/g, "\\'")}')">
        <img src="${meta.background || meta.poster}" loading="eager">
        <div class="scrim"></div>
        <div class="content">
          <div class="eyebrow">
            ${isLive ? '<span class="badge badge--pink">Live</span>' : ''}
            ${category ? `<span class="t-meta">${category}</span>` : ''}
          </div>
          <h1 class="t-display">${cleanTitle(meta)}</h1>
          ${league ? `<div class="meta">${league}</div>` : ''}
          <div class="cta-row">
            <button class="btn btn--lg"><svg width="18" height="18"><use href="#i-play"/></svg> Watch now</button>
          </div>
        </div>
      </div>`;
  }

  async function loadEverything() {
    let manifest;
    try {
      manifest = await (await fetch('/manifest.json')).json();
    } catch (err) {
      console.error('Failed to load manifest', err);
      document.getElementById('rails').innerHTML = '<p style="padding:0 var(--sp-4);color:var(--sem-danger)">Failed to load categories.</p>';
      toast('Could not reach the addon server.', 'danger');
      return;
    }

    const catalogs = manifest.catalogs.filter(c => c.type === 'tv' && c.id !== 'nuvio_sports_teams');
    const railsHost = document.getElementById('rails');
    const quicknav = document.getElementById('quicknav');
    railsHost.innerHTML = '';
    quicknav.innerHTML = '';

    catalogs.forEach(catalog => {
      const label = catalog.name.replace('nuvio ', '').replace('Nuvio ', '');
      const railId = 'rail-' + catalog.id;

      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.innerText = label;
      chip.onclick = () => document.getElementById(railId)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      quicknav.appendChild(chip);

      const section = document.createElement('section');
      section.className = 'rail';
      section.id = railId;
      section.innerHTML = `
        <div class="rail-head">
          <h2>${label}</h2>
          <div class="rail-nav">
            <button class="btn btn--icon btn--secondary btn--sm" onclick="scrollRail('${railId}',-1)" aria-label="Scroll left">
              <svg width="16" height="16" style="transform:rotate(180deg)"><use href="#i-chevron"/></svg>
            </button>
            <button class="btn btn--icon btn--secondary btn--sm" onclick="scrollRail('${railId}',1)" aria-label="Scroll right">
              <svg width="16" height="16"><use href="#i-chevron"/></svg>
            </button>
          </div>
        </div>
        <div class="rail-scroll-outer">
          <div class="rail-scroller" id="scroller-${catalog.id}">${railSkeleton(6)}</div>
        </div>`;
      railsHost.appendChild(section);
    });

    let heroSet = false;

    catalogs.forEach(async (catalog) => {
      try {
        const res = await fetch(`/catalog/tv/${catalog.id}.json`);
        const data = await res.json();
        const metas = data.metas || [];
        metas.forEach(m => allMatches.set(m.id, m));

        const scroller = document.getElementById(`scroller-${catalog.id}`);
        if (!scroller) return;

        if (metas.length === 0) {
          document.getElementById('rail-' + catalog.id).style.display = 'none';
          return;
        }
        scroller.innerHTML = metas.map(rcardHTML).join('');

        if (!heroSet) {
          const liveOne = metas.find(isLiveMeta);
          if (liveOne || catalog.id === catalogs[0].id) {
            renderHero(liveOne || metas[0]);
            heroSet = true;
          }
        }
      } catch (err) {
        console.error('Failed to load catalog', catalog.id, err);
        const scroller = document.getElementById(`scroller-${catalog.id}`);
        if (scroller) scroller.innerHTML = '<span class="t-secondary" style="padding:0 var(--sp-2)">Failed to load.</span>';
      }
    });
  }

  function scrollRail(railId, dir) {
    const scroller = document.querySelector(`#${railId} .rail-scroller`);
    if (scroller) scroller.scrollBy({ left: dir * scroller.clientWidth * 0.8, behavior: 'smooth' });
  }

  function openSearch() {
    document.getElementById('searchOverlay').style.display = 'flex';
    const input = document.getElementById('searchInput');
    input.value = '';
    document.getElementById('searchResults').innerHTML = '<p class="t-secondary" style="grid-column:1/-1;padding:var(--sp-4) 0">Start typing to search everything that has loaded so far.</p>';
    setTimeout(() => input.focus(), 50);
  }
  function closeSearch() { document.getElementById('searchOverlay').style.display = 'none'; }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase().trim();
    const results = document.getElementById('searchResults');
    if (!query) {
      results.innerHTML = '<p class="t-secondary" style="grid-column:1/-1;padding:var(--sp-4) 0">Start typing to search everything that has loaded so far.</p>';
      return;
    }
    const matches = Array.from(allMatches.values()).filter(meta =>
      meta.name.toLowerCase().includes(query) ||
      (meta.description && meta.description.toLowerCase().includes(query))
    );
    results.innerHTML = matches.length
      ? matches.map(rcardHTML).join('')
      : '<p class="t-secondary" style="grid-column:1/-1;padding:var(--sp-4) 0">No matches found.</p>';
  });

  async function fetchAndPlay(id) {
    document.getElementById('player-overlay').style.display = 'flex';
    document.getElementById('loader').style.display = 'flex';
    closeSourceSheet();
    const video = document.getElementById('video');
    video.style.opacity = '0';

    // Prime the media element synchronously within the click's gesture
    // context. Mobile browsers gate autoplay to calls made during (or very
    // soon after) a user gesture; the fetch below is async, so by the time
    // the real stream is ready that window can have closed.
    try { video.muted = true; video.play().catch(() => {}); } catch (_) {}

    try {
      const res = await fetch(`/stream/tv/${id}.json`);
      const data = await res.json();

      if (!data.streams || data.streams.length === 0) {
        toast('No streams found for this match.', 'danger');
        closePlayer();
        return;
      }

      if (data.streams.length === 1) {
        playStreamUrl(data.streams[0].url, data.streams[0]);
      } else {
        document.getElementById('loader').style.display = 'none';
        const btnContainer = document.getElementById('source-buttons');
        btnContainer.innerHTML = '';

        data.streams.forEach(stream => {
          const btn = document.createElement('button');
          btn.className = 'btn btn--secondary btn--block';
          btn.style.justifyContent = 'space-between';
          btn.innerHTML = `${stream.title} <svg width="18" height="18"><use href="#i-chevron"/></svg>`;
          btn.onclick = () => {
            closeSourceSheet();
            document.getElementById('loader').style.display = 'flex';
            playStreamUrl(stream.url, stream);
          };
          btnContainer.appendChild(btn);
        });

        document.getElementById('sheet-backdrop').style.display = 'flex';
      }
    } catch (err) {
      console.error(err);
      toast('Error resolving stream.', 'danger');
      closePlayer();
    }
  }

  function closeSourceSheet() {
    document.getElementById('sheet-backdrop').style.display = 'none';
  }

  function unmuteVideo() {
    const video = document.getElementById('video');
    video.muted = false;
    document.getElementById('unmuteHint').style.display = 'none';
  }

  function playStreamUrl(url, streamObj = null) {
    if (streamObj && streamObj.externalUrl) {
      window.open(streamObj.externalUrl, '_blank');
      closePlayer();
      return;
    }

    const video = document.getElementById('video');
    document.getElementById('loader').style.display = 'none';
    video.style.opacity = '1';

    if (!url) {
      toast('This stream cannot be played in the browser directly.', 'danger');
      closePlayer();
      return;
    }

    const tryUnmuteAfterStart = () => {
      video.muted = false;
      if (video.muted) document.getElementById('unmuteHint').style.display = 'inline-flex';
    };

    if (Hls.isSupported()) {
      if (hls) hls.destroy();
      hls = new Hls({ maxBufferLength: 30 });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().then(tryUnmuteAfterStart).catch(() => {
          document.getElementById('unmuteHint').style.display = 'inline-flex';
        });
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play().then(tryUnmuteAfterStart).catch(() => {
        document.getElementById('unmuteHint').style.display = 'inline-flex';
      });
    }
  }

  function closePlayer() {
    document.getElementById('player-overlay').style.display = 'none';
    document.getElementById('unmuteHint').style.display = 'none';
    closeSourceSheet();
    const video = document.getElementById('video');
    video.pause();
    video.src = '';
    video.muted = true;
    if (hls) { hls.destroy(); hls = null; }
  }

  loadEverything();
</script>
