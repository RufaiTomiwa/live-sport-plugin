<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvio Live Sports | Configure</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='17' fill='none' stroke='%23FF2A3F' stroke-width='4'/%3E%3Ccircle cx='20' cy='20' r='8' fill='%23FF2A3F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pulse.css">
  <style>
    body{
      background-image:
        radial-gradient(circle at 15% 0%,rgba(255,42,63,.08),transparent 32%),
        radial-gradient(circle at 85% 20%,rgba(46,134,255,.08),transparent 32%);
    }
    main{max-width:640px;margin:0 auto;padding:var(--sp-6) var(--sp-4) var(--sp-8)}
    .header{text-align:center;margin-bottom:var(--sp-6)}
    .header h1{font-size:clamp(2rem,7vw,2.75rem);margin:var(--sp-3) 0 var(--sp-2);
      display:flex;align-items:center;justify-content:center;gap:var(--sp-3)}
    .dot{width:12px;height:12px;background:var(--live);border-radius:50%;box-shadow:0 0 12px rgba(255,42,63,.5);
      animation:pulseLive 1.8s infinite}
    .section{padding:var(--sp-5);margin-bottom:var(--sp-4)}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-4)}
    .checks-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-2)}
    @media (max-width:480px){.checks-grid{grid-template-columns:1fr}}
    .check span.label-text{font-size:var(--size-sm);font-family:var(--font-ui)}
    .backlink{display:inline-flex;align-items:center;gap:var(--sp-1);color:var(--text-2);
      text-decoration:none;font-size:var(--size-sm);margin-bottom:var(--sp-5);font-family:var(--font-mono);
      text-transform:uppercase;letter-spacing:.06em}
    .backlink:hover{color:var(--text-1)}
  </style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></symbol>
</svg>

<main>
  <a href="/" class="backlink"><svg width="14" height="14" style="transform:rotate(180deg)"><use href="#i-chevron"/></svg> Back to matches</a>

  <div class="header">
    <h1 class="t-display"><span class="dot"></span> Nuvio Sports</h1>
    <p class="t-secondary">Customize your ultimate live sports dashboard.</p>
  </div>

  <div class="card section">
    <div class="section-head">
      <h3 class="t-label" style="margin:0">Select sports</h3>
      <div style="display:flex;gap:var(--sp-2)">
        <button class="btn btn--ghost btn--sm" id="sportsAll">All</button>
        <button class="btn btn--ghost btn--sm" id="sportsNone">None</button>
      </div>
    </div>
    <div class="checks-grid" id="sportsGrid"></div>
  </div>

  <div class="card section">
    <h3 class="t-label" style="margin:0 0 var(--sp-4)">Localization</h3>
    <div class="field">
      <label class="label" for="timezone">Match times shown in</label>
      <select id="timezone" class="select"></select>
    </div>
  </div>

  <div class="card section">
    <h3 class="t-label" style="margin:0 0 var(--sp-4)">Priority tracking</h3>
    <div class="field">
      <label class="label" for="teams">Favorite teams (comma separated)</label>
      <input type="text" id="teams" class="input" placeholder="e.g. Arsenal, Lakers, Ferrari">
      <span class="hint">These populate a dedicated "Your Teams" catalog at the top of the app.</span>
    </div>
  </div>

  <div class="card section">
    <div class="section-head">
      <h3 class="t-label" style="margin:0">Streaming sources</h3>
      <div style="display:flex;gap:var(--sp-2)">
        <button class="btn btn--ghost btn--sm" id="sourcesAll">All</button>
        <button class="btn btn--ghost btn--sm" id="sourcesNone">None</button>
      </div>
    </div>
    <div class="checks-grid" id="sourcesGrid"></div>
  </div>

  <a href="#" id="installBtn" class="btn btn--info btn--block btn--lg">Install addon</a>
  <button id="copyBtn" class="btn btn--outline btn--block" style="margin-top:var(--sp-3)">Copy link (for Nuvio app)</button>
</main>

<div id="toastHost" aria-live="polite"></div>

<script>
  const SPORTS = [
    ['football', '⚽ Football'], ['basketball', '🏀 Basketball'], ['cricket', '🏏 Cricket'],
    ['american_football', '🏈 NFL'], ['motorsport', '🏎️ Racing'], ['hockey', '🏒 Hockey'],
    ['baseball', '⚾ Baseball'], ['rugby', '🏉 Rugby'], ['college', '🎓 College'],
    ['mma', '🥊 MMA'], ['golf', '⛳ Golf'], ['tennis', '🎾 Tennis'],
    ['darts', '🎯 Darts'], ['other', '📡 Other Sports']
  ];
  const SOURCES = [
    ['streamfree', '🌐 StreamFree (Recommended)'], ['timstreams', '📺 TimStreams (Recommended)'],
    ['bintv', '📺 BinTV (Recommended)'], ['ntv', '📺 NTV'], ['iptv-org', '📡 IPTV Org (Direct IPTV)'],
    ['sportyhunter', '📺 SportyHunter'], ['streamsports', '📺 StreamSports'], ['watchfooty', '📺 WatchFooty'],
    ['cdnlive', '📺 CDNLiveTV'], ['streamsports99', '📺 StreamSports99'],
    ['ppvdomains', '🌐 PPV Domains'], ['streamic', '🌐 Streamic']
  ];

  function buildChecks(container, items, idPrefix) {
    container.innerHTML = items.map(([value, label], i) => `
      <label class="check active" data-value="${value}">
        <input type="checkbox" id="${idPrefix}${i}" value="${value}" checked>
        <span class="box"><svg width="13" height="13"><use href="#i-check"/></svg></span>
        <span class="label-text">${label}</span>
      </label>`).join('');
  }

  const sportsGrid = document.getElementById('sportsGrid');
  const sourcesGrid = document.getElementById('sourcesGrid');
  buildChecks(sportsGrid, SPORTS, 'sport-');
  buildChecks(sourcesGrid, SOURCES, 'source-');

  const btn = document.getElementById('installBtn');
  const copyBtn = document.getElementById('copyBtn');
  const input = document.getElementById('teams');
  const timezoneSelect = document.getElementById('timezone');

  function checkboxes() { return sportsGrid.querySelectorAll('input[type="checkbox"]'); }
  function sourceCheckboxes() { return sourcesGrid.querySelectorAll('input[type="checkbox"]'); }

  function toast(message) {
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = 'toast toast--ok';
    el.setAttribute('role', 'status');
    el.innerHTML = `<svg width="18" height="18" style="color:var(--sp-football)"><use href="#i-check"/></svg><span>${message}</span>`;
    host.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 200ms'; setTimeout(() => el.remove(), 220); }, 2200);
  }

  // Attempt to load existing config from URL
  let existingConfig = {};
  try {
    const pathParts = window.location.pathname.split('/');
    if (pathParts.length >= 3 && pathParts[pathParts.length - 1] === 'configure') {
      const encoded = pathParts[pathParts.length - 2];
      let base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      existingConfig = JSON.parse(decodeURIComponent(escape(atob(base64))));
    }
  } catch (e) {
    console.warn("Could not parse existing config from URL", e);
  }

  // Populate timezones
  try {
    const popularTimezones = [
      { value: 'Pacific/Midway', label: 'Midway Island (GMT-11:00)' },
      { value: 'Pacific/Honolulu', label: 'Hawaii (GMT-10:00)' },
      { value: 'America/Anchorage', label: 'Alaska (GMT-09:00)' },
      { value: 'America/Los_Angeles', label: 'Pacific Time (GMT-08:00)' },
      { value: 'America/Denver', label: 'Mountain Time (GMT-07:00)' },
      { value: 'America/Chicago', label: 'Central Time (GMT-06:00)' },
      { value: 'America/New_York', label: 'Eastern Time (GMT-05:00)' },
      { value: 'America/Halifax', label: 'Atlantic Time (GMT-04:00)' },
      { value: 'America/Sao_Paulo', label: 'Brazil (GMT-03:00)' },
      { value: 'Atlantic/South_Georgia', label: 'Mid-Atlantic (GMT-02:00)' },
      { value: 'Atlantic/Azores', label: 'Azores (GMT-01:00)' },
      { value: 'Europe/London', label: 'UK & Ireland (GMT+00:00)' },
      { value: 'Europe/Paris', label: 'Western Europe (GMT+01:00)' },
      { value: 'Europe/Athens', label: 'Eastern Europe (GMT+02:00)' },
      { value: 'Europe/Moscow', label: 'Russia - Moscow (GMT+03:00)' },
      { value: 'Asia/Dubai', label: 'UAE (GMT+04:00)' },
      { value: 'Asia/Karachi', label: 'Pakistan (GMT+05:00)' },
      { value: 'Asia/Kolkata', label: 'India (GMT+05:30)' },
      { value: 'Asia/Dhaka', label: 'Bangladesh (GMT+06:00)' },
      { value: 'Asia/Bangkok', label: 'Thailand & Vietnam (GMT+07:00)' },
      { value: 'Asia/Singapore', label: 'Singapore & Malaysia (GMT+08:00)' },
      { value: 'Asia/Tokyo', label: 'Japan (GMT+09:00)' },
      { value: 'Australia/Sydney', label: 'Eastern Australia (GMT+10:00)' },
      { value: 'Pacific/Noumea', label: 'New Caledonia (GMT+11:00)' },
      { value: 'Pacific/Auckland', label: 'New Zealand (GMT+12:00)' }
    ];

    const localTz = existingConfig.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone;
    let matchedLocal = false;

    popularTimezones.forEach(tz => {
      const option = document.createElement('option');
      option.value = tz.value;
      option.textContent = tz.label;
      if (tz.value === localTz) { option.selected = true; matchedLocal = true; }
      timezoneSelect.appendChild(option);
    });

    if (!matchedLocal && localTz) {
      const option = document.createElement('option');
      option.value = localTz;
      const date = new Date();
      const offset = -date.getTimezoneOffset();
      const sign = offset >= 0 ? '+' : '-';
      const hours = Math.floor(Math.abs(offset) / 60).toString().padStart(2, '0');
      const mins = (Math.abs(offset) % 60).toString().padStart(2, '0');
      const loc = localTz.split('/').pop().replace(/_/g, ' ');
      option.textContent = `${loc} (GMT${sign}${hours}:${mins})`;
      option.selected = true;
      timezoneSelect.insertBefore(option, timezoneSelect.firstChild);
    }
  } catch (e) {
    console.warn("Timezone API not fully supported.", e);
  }

  // Apply existing config settings to UI
  if (existingConfig.teams) input.value = existingConfig.teams;

  function applyExistingSelection(cbs, configValue) {
    if (!configValue) return;
    if (configValue === 'none') {
      cbs.forEach(cb => { cb.checked = false; cb.closest('.check').classList.remove('active'); });
    } else if (configValue !== 'all') {
      const values = configValue.split(',');
      cbs.forEach(cb => {
        cb.checked = values.includes(cb.value);
        cb.closest('.check').classList.toggle('active', cb.checked);
      });
    }
  }
  applyExistingSelection(checkboxes(), existingConfig.sports);
  applyExistingSelection(sourceCheckboxes(), existingConfig.sources);

  let currentManifestUrl = '';

  function updateLink() {
    const teams = input.value.trim();
    const selectedSports = Array.from(checkboxes()).filter(cb => cb.checked).map(cb => cb.value);
    const selectedSources = Array.from(sourceCheckboxes()).filter(cb => cb.checked).map(cb => cb.value);
    const tz = timezoneSelect.value;

    let manifestUrl = window.location.origin + '/manifest.json';
    const config = {};
    if (teams) config.teams = teams;
    if (tz) config.timezone = tz;

    const allCbs = checkboxes();
    if (selectedSports.length < allCbs.length) {
      config.sports = selectedSports.join(',') || 'none';
    }
    const allSourceCbs = sourceCheckboxes();
    if (selectedSources.length < allSourceCbs.length) {
      config.sources = selectedSources.join(',') || 'none';
    }

    if (Object.keys(config).length > 0) {
      const base64Str = btoa(unescape(encodeURIComponent(JSON.stringify(config))));
      const encoded = base64Str.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      manifestUrl = window.location.origin + '/' + encoded + '/manifest.json';
    }

    currentManifestUrl = manifestUrl;
    btn.href = manifestUrl.replace(/^https?:\/\//, 'stremio://');
  }

  function wireGrid(grid) {
    grid.addEventListener('change', (e) => {
      if (e.target.type !== 'checkbox') return;
      e.target.closest('.check').classList.toggle('active', e.target.checked);
      updateLink();
    });
  }
  wireGrid(sportsGrid);
  wireGrid(sourcesGrid);

  document.getElementById('sportsAll').onclick = () => { checkboxes().forEach(cb => { cb.checked = true; cb.closest('.check').classList.add('active'); }); updateLink(); };
  document.getElementById('sportsNone').onclick = () => { checkboxes().forEach(cb => { cb.checked = false; cb.closest('.check').classList.remove('active'); }); updateLink(); };
  document.getElementById('sourcesAll').onclick = () => { sourceCheckboxes().forEach(cb => { cb.checked = true; cb.closest('.check').classList.add('active'); }); updateLink(); };
  document.getElementById('sourcesNone').onclick = () => { sourceCheckboxes().forEach(cb => { cb.checked = false; cb.closest('.check').classList.remove('active'); }); updateLink(); };

  copyBtn.addEventListener('click', (e) => {
    e.preventDefault();
    navigator.clipboard.writeText(currentManifestUrl).then(() => toast('Link copied to clipboard.'));
  });

  input.addEventListener('input', updateLink);
  timezoneSelect.addEventListener('change', updateLink);

  updateLink();
</script>
</body>
</html>
